<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Fourteen production-ready micro-interaction recipes built on the Web Animations API. No dependencies, no framework, under thirty lines each."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <title>motion - web animation recipes with zero dependencies</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("motion-theme");
          if (saved !== "light" && saved !== "dark") {
            saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", saved);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#recipes">Skip to the recipes</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
